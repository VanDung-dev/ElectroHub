{% extends "base.html" %}
{% block content %}
<nav class="breadcrumb" aria-label="Đường dẫn"><a href="/cart">Giỏ hàng</a><span>/</span><span>Đặt hàng</span></nav><h1>Thông tin đặt hàng</h1>
<div class="shopping-layout"><form data-checkout class="form-card checkout-form"><h2>Địa chỉ nhận hàng</h2><label>Họ và tên<input name="name" required maxlength="100" autocomplete="name"></label><label>Số điện thoại<input name="phone" type="tel" required pattern="0[0-9]{9}" autocomplete="tel" placeholder="VD: 0901234567"></label><label>Địa chỉ nhận hàng<textarea name="address" required minlength="5" maxlength="255" autocomplete="street-address" rows="3" placeholder="Số nhà, đường, phường/xã, tỉnh/thành phố"></textarea></label><fieldset class="payment-options"><legend>Thanh toán trực tuyến (mô phỏng)</legend><label><input type="radio" name="payment_method" value="PAYPAL" required checked> PayPal <small>Thanh toán quốc tế · Mô phỏng</small></label><label><input type="radio" name="payment_method" value="VNPAY" required> VNPAY <small>Thanh toán trong nước · Mô phỏng</small></label><p class="purchase-note">Bản demo không thu tiền và không yêu cầu thông tin thẻ hoặc tài khoản ngân hàng.</p></fieldset><button disabled data-place-order>Xác nhận đặt hàng</button><p data-message role="status" aria-live="polite"></p></form><aside class="order-summary"><h2>Đơn hàng của bạn</h2><div data-checkout-summary><p>Đang tải giỏ hàng…</p></div><a href="/cart">Chỉnh sửa giỏ hàng</a></aside></div>
{% endblock %}

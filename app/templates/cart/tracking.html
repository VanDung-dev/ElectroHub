{% extends "base.html" %}
{% block content %}<nav class="breadcrumb" aria-label="Đường dẫn"><a href="/">Trang chủ</a><span>/</span><span>Tra cứu đơn hàng</span></nav><h1>Tra cứu đơn hàng</h1><p>Nhập mã đơn và số điện thoại đã dùng khi đặt hàng. Nếu đã đăng nhập, bạn có thể tra cứu đơn của mình bằng mã đơn.</p><form data-track class="form-card"><label>Mã đơn hàng<input name="code" required value="{{ tracking_code }}" autocomplete="off"></label><label>Số điện thoại đặt hàng<input name="phone" type="tel" pattern="0[0-9]{9}" autocomplete="tel"></label><button>Tra cứu đơn hàng</button></form><div data-result aria-live="polite"></div>{% endblock %}

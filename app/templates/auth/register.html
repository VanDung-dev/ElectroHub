{% extends "base.html" %}
{% block content %}<section class="auth-page"><p class="eyebrow">TÀI KHOẢN ELECTROHUB</p><h1>Tạo tài khoản</h1><p>Đặt hàng và theo dõi đơn mua của bạn.</p><form data-register class="form-card"><label>Họ và tên<input name="name" required maxlength="100" autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Mật khẩu<input type="password" name="password" minlength="8" required autocomplete="new-password"><small>Tối thiểu 8 ký tự.</small></label><label>Nhập lại mật khẩu<input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></label><button>Tạo tài khoản</button><p data-message role="status" aria-live="polite"></p></form><p>Đã có tài khoản? <a href="/account/login">Đăng nhập</a></p></section>{% endblock %}

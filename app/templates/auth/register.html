{% extends "base.html" %}
{% block content %}<section class="auth-page"><p class="eyebrow">TÀI KHOẢN ELECTROHUB</p><h1>Tạo tài khoản</h1><p>Đặt hàng và theo dõi đơn mua của bạn.</p><form data-register class="form-card"><label>Họ và tên<input name="name" required maxlength="100" autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Mật khẩu<div class="password-field"><input type="password" name="password" minlength="8" required autocomplete="new-password"><button type="button" class="btn-toggle-password" aria-label="Hiện mật khẩu" title="Hiện/ẩn mật khẩu"><svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div><small>Tối thiểu 8 ký tự.</small></label><label>Nhập lại mật khẩu<div class="password-field"><input type="password" name="confirm_password" minlength="8" required autocomplete="new-password"><button type="button" class="btn-toggle-password" aria-label="Hiện mật khẩu" title="Hiện/ẩn mật khẩu"><svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></label><label class="form-checkbox-inline" style="display:flex!important;flex-direction:row!important;align-items:center!important;gap:10px!important;cursor:pointer;font-size:0.9rem;margin:8px 0 4px;user-select:none;"><input type="checkbox" name="is_subscribed_newsletter" value="true" style="width:17px!important;height:17px!important;min-height:auto!important;margin:0!important;padding:0!important;accent-color:var(--accent);cursor:pointer;flex-shrink:0;"><span>Đăng ký nhận email marketing và ưu đãi</span></label><button>Tạo tài khoản</button><p data-message role="status" aria-live="polite"></p></form><p>Đã có tài khoản? <a href="/account/login">Đăng nhập</a></p></section>{% endblock %}

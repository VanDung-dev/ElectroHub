name: electrohub

x-app-environment: &app-environment
  SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters in .env}
  MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong MSSQL_SA_PASSWORD in .env}
  SQLSERVER_HOST: sqlserver
  SQLSERVER_PORT: "1433"
  SQLSERVER_DATABASE: ElectroHub
  SQLSERVER_TRUST_CERTIFICATE: ${SQLSERVER_TRUST_CERTIFICATE:-true}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
  SITE_URL: ${SITE_URL:-http://localhost:8000}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-ElectroHub <noreply@electrohub.vn>}
  FACEBOOK_PAGE_URL: ${FACEBOOK_PAGE_URL:-}
  ZALO_PAGE_URL: ${ZALO_PAGE_URL:-}
  SUBIZ_EMBED_CODE: ${SUBIZ_EMBED_CODE:-}
  PROPERTY_ID: ${PROPERTY_ID:-${TAWKTO_PROPERTY_ID:-}}
  WIDGET_ID: ${WIDGET_ID:-${TAWKTO_WIDGET_ID:-}}
  TAWKTO_EMBED_CODE: ${TAWKTO_EMBED_CODE:-}
  STORE_ADDRESS: ${STORE_ADDRESS:-}
  GOOGLE_MAPS_EMBED_URL: ${GOOGLE_MAPS_EMBED_URL:-}
  GOOGLE_MAPS_DIRECT_URL: ${GOOGLE_MAPS_DIRECT_URL:-}
  # Payments: the app container needs these explicitly; .env alone is not injected.
  PAYMENT_MODE: ${PAYMENT_MODE:-mock}
  REFUND_HOLD_HOURS: ${REFUND_HOLD_HOURS:-72}
  VAT_PERCENT: ${VAT_PERCENT:-10}
  VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
  VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
  VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
  PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
  PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
  PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
  PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
  PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}
  PAYPAL_VND_PER_USD: ${PAYPAL_VND_PER_USD:-25000}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # shortcut: SQL Server requires amd64; use an x86-64 host for supported deployment.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong MSSQL_SA_PASSWORD in .env}
    ports:
      - "0.0.0.0:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: >-
        SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./docker/init.sql:/init.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command: ["-S", "sqlserver", "-U", "sa", "-C", "-b", "-i", "/init.sql"]
    restart: "no"

  sqlserver-test:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: electrohub-sqlserver-test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong MSSQL_SA_PASSWORD in .env}
    ports:
      - "0.0.0.0:${SQLSERVER_TEST_PORT:-1434}:1433"
    volumes:
      - sqlserver_test_data:/var/opt/mssql
      - ./sql:/sql:ro
    healthcheck:
      test: >-
        SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd
        -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  sqlserver-test-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: electrohub-sqlserver-test-init
    depends_on:
      sqlserver-test:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set a strong MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./sql:/sql:ro
      - ./docker/init-test.sh:/init-test.sh:ro
    entrypoint: ["/bin/sh", "/init-test.sh"]
    restart: "no"

  migrate:
    build: .
    image: electrohub-app:local
    environment: *app-environment
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "alembic upgrade head && python -m app.seeds.accounts && python -m app.seeds.seed"]
    restart: "no"

  app:
    build: .
    image: electrohub-app:local
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # localtunnel: expose app to the public web via HTTPS tunnel (https://<subdomain>.loca.lt)
  localtunnel:
    image: node:22-alpine
    restart: unless-stopped
    command:
      - "npx"
      - "-y"
      - "localtunnel"
      - "--port"
      - "8000"
      - "--local-host"
      - "app"
      - "--subdomain"
      - "${LOCALTUNNEL_SUBDOMAIN:-electrohub}"
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: electrohub-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  sqlserver_data:
  sqlserver_test_data:
